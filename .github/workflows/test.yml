name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 11 * * *"      # once a day (11:23 UTC): requirements.txt is unpinned, so a new release of a dependency can break the suite
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      # The same suite with the clock a year ahead: a test that only passes because of today's date fails here first,
      # long before the real date reaches it (a backfill test broke on 2026-10-14 that way).
      - name: tests with the clock 400 days ahead
        run: |
          pip install time-machine
          python tests/shifted_clock.py 400
      - run: for f in options_whale/static/*.js; do node --check "$f"; done
