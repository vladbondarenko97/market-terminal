name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # the arm64 build runs under QEMU, which is slow
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - id: commit
        run: |
          echo "committed=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_SUBJECT=${{ steps.commit.outputs.subject }}
            GIT_COMMITTED=${{ steps.commit.outputs.committed }}
          tags: |
            ghcr.io/vladbondarenko97/market-terminal:latest
            ghcr.io/vladbondarenko97/market-terminal:${{ github.sha }}
